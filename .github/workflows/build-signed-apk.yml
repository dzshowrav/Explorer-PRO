name: Build Signed Release APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Debug & Production Keystores
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'ExplorerProReleaseKey2026' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'ExplorerProReleaseKey2026' }}
        run: |
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -noprompt -v \
                -storetype PKCS12 \
                -keystore debug.keystore \
                -alias androiddebugkey \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass android \
                -keypass android \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          elif [ ! -f "my-upload-key.jks" ]; then
            echo "Generating production upload keystore..."
            keytool -genkeypair -noprompt -v \
              -storetype PKCS12 \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=ExplorerPro,O=NativeAndroid,C=US"
          fi

      - name: Run Unit & Robolectric Tests
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'ExplorerProReleaseKey2026' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'ExplorerProReleaseKey2026' }}
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'ExplorerProReleaseKey2026' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'ExplorerProReleaseKey2026' }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK Signature & Output
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_PATH"
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            yes | sdkmanager "build-tools;36.0.0" >/dev/null || true
            APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          fi
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK_PATH"

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: explorer-pro-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
