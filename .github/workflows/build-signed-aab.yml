name: Build Signed Release AAB

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Run Full Test Suite
        run: gradle test

      - name: Materialize Production Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          else
            keytool -genkeypair -v \
              -storetype PKCS12 \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${STORE_PASSWORD:-ExplorerProReleaseKey2026}" \
              -keypass "${KEY_PASSWORD:-ExplorerProReleaseKey2026}" \
              -dname "CN=ExplorerPro,O=NativeAndroid,C=US"
          fi

      - name: Build Signed Release AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'ExplorerProReleaseKey2026' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'ExplorerProReleaseKey2026' }}
        run: gradle :app:bundleRelease

      - name: Upload Signed Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: explorer-pro-signed-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
